[sydr]
args = "--wait-jobs -s 90"
target = "/sydr/decode_gif_sydr @@"
jobs = 4

[libfuzzer]
path = "/fuzzer/decode_gif_fuzzer"
args = "-rss_limit_mb=32384 -timeout=300 -jobs=1000 -workers=6 /corpus_gif"
[libfuzzer.env]
ASAN_OPTIONS = "detect_leaks=0"

[cov]
target = "/cov/decode_gif_cov @@"
