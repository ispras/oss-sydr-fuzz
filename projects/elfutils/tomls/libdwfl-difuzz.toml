exit-on-time = 7200

[sydr]
args = "--wait-jobs -s 90 -j2"
target = "/result/fuzz/sydr/fuzz-libdwfl @@"
jobs = 2

[difuzz]
path = "/sydr-fuzz/sydr/difuzz/libafl_difuzz"
target = "/result/fuzz/difuzz/libdwfl/difuzz_target_libdwfl @@"
args = "-j4 -l64 -i /result/fuzz/corpus -e /result/fuzz/difuzz/libdwfl/ets.toml"
casr_bin = "/result/fuzz/difuzz/libdwfl/casr_libdwfl"

[cov]
target = "/result/fuzz/cov/fuzz-libdwfl @@"
