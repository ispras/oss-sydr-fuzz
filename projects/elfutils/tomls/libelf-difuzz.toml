exit-on-time = 7200

[sydr]
args = "--wait-jobs -s 90 -j2"
target = "/result/fuzz/sydr/fuzz-libelf @@"
jobs = 2

[difuzz]
path = "/sydr-fuzz/sydr/difuzz/libafl_difuzz"
target = "/result/fuzz/difuzz/libelf/difuzz_target_libelf @@"
args = "-j4 -l64 -i /result/fuzz/corpus -e /result/fuzz/difuzz/libelf/ets.toml"
casr_bin = "/result/fuzz/difuzz/libelf/casr_libelf"

[cov]
target = "/result/fuzz/cov/fuzz-libelf @@"
